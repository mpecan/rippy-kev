# Timing run: 10 optimizer steps from Qwen3.5-2B-Base (reference Hobson recipe, our data).
train_files: [data/v2/decider/train.jsonl]
teacher_file: data/v2/decider/train.teacher.jsonl
teacher_weight: 1.0
val_fraction: 0.002
base_model: Qwen/Qwen3.5-2B-Base
head_type: pointer
pointer_dim: 256
num_slots: 24
max_length: 1024
use_lora: true
lora_r: 16
lora_alpha: 32
lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z, in_proj_a, in_proj_b, out_proj]
kl_frozen_weight: 0.0
epochs: 1
micro_batch_size: 16
grad_accum: 2
lr: 1.0e-4
head_lr: 1.0e-3
gradient_checkpointing: false
group_by_length: true
max_steps: 8
log_every: 1
eval_every: 100000
output_dir: runs/decider-timing-b32
